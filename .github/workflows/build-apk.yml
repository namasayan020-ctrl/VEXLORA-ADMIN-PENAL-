name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets
        run: |
          npm install
          npm run build

      - name: Generate Android Gradle project
        run: |
          mkdir -p gradle app/src/main/java/com/vexlora/adminpanel app/src/main/res/values app/src/main/res/mipmap-xxxhdpi app/src/main/assets/www
          cp -r dist/* app/src/main/assets/www/
          cp public/assets/aistudio/file_00000000bc7c8211adcf0a804031e62b_46000da4.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "9.1.1"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VexLoraAdminPanel"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
          }
          android {
              namespace = "com.vexlora.adminpanel"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.vexlora.adminpanel"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  getByName("debug") {
                      val localDebugKeystore = rootProject.file("debug.keystore")
                      if (localDebugKeystore.exists()) {
                          storeFile = localDebugKeystore
                          storePassword = "android"
                          keyAlias = "androiddebugkey"
                          keyPassword = "android"
                      }
                  }
              }
              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }
              androidResources {
                  noCompress += listOf("wav")
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="VEX LORA ADMIN PANEL"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/VexLoraTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="VexLoraTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#05070e</item>
                  <item name="android:colorBackground">#05070e</item>
                  <item name="android:statusBarColor">#05070e</item>
                  <item name="android:navigationBarColor">#060913</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/vexlora/adminpanel/MainActivity.java
          package com.vexlora.adminpanel;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String APP_HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + APP_HOST + "/index.html";
              private WebView webView;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.getDecorView().setBackgroundColor(Color.parseColor("#05070e"));
                  applySystemBarColors(window);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#05070e"));
                  webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  webView.addJavascriptInterface(new AndroidClipboardBridge(this), "AndroidClipboard");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new LocalAssetWebViewClient());

                  setContentView(webView);
                  webView.loadUrl(START_URL);
              }

              @SuppressWarnings("deprecation")
              private void applySystemBarColors(Window window) {
                  window.setStatusBarColor(Color.parseColor("#05070e"));
                  window.setNavigationBarColor(Color.parseColor("#060913"));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }

              @SuppressWarnings("deprecation")
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private static class AndroidClipboardBridge {
                  private final Context appContext;
                  AndroidClipboardBridge(Context context) {
                      this.appContext = context.getApplicationContext();
                  }
                  @JavascriptInterface
                  public boolean copy(String text) {
                      if (text == null) return false;
                      ClipboardManager clipboard = (ClipboardManager) appContext.getSystemService(Context.CLIPBOARD_SERVICE);
                      if (clipboard == null) return false;
                      clipboard.setPrimaryClip(ClipData.newPlainText("VEX LORA Key", text));
                      return true;
                  }
              }

              private class LocalAssetWebViewClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                      Uri uri = request.getUrl();
                      if (uri == null || APP_HOST.equals(uri.getHost())) return false;
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception ignored) {}
                      return true;
                  }

                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      Uri uri = request.getUrl();
                      if (uri == null || !APP_HOST.equals(uri.getHost())) {
                          return super.shouldInterceptRequest(view, request);
                      }
                      String path = uri.getPath();
                      if (path == null || path.isEmpty() || "/".equals(path)) path = "/index.html";
                      String relativePath = path.startsWith("/") ? path.substring(1) : path;
                      if (relativePath.contains("..")) return null;
                      String assetPath = "www/" + relativePath;
                      String mimeType = getMimeType(relativePath);
                      try {
                          String rangeHeader = getRangeHeader(request.getRequestHeaders());
                          if (rangeHeader != null && rangeHeader.startsWith("bytes=")) {
                              byte[] data = readAllBytes(getAssets().open(assetPath));
                              int total = data.length;
                              String rangeSpec = rangeHeader.substring("bytes=".length()).split(",")[0].trim();
                              String[] bounds = rangeSpec.split("-", -1);
                              int start = bounds[0].isEmpty() ? 0 : Integer.parseInt(bounds[0]);
                              int end = (bounds.length > 1 && !bounds[1].isEmpty()) ? Math.min(Integer.parseInt(bounds[1]), total - 1) : total - 1;
                              if (start < 0 || start >= total || end < start) {
                                  start = 0;
                                  end = total - 1;
                              }
                              int len = end - start + 1;
                              Map<String, String> headers = new HashMap<>();
                              headers.put("Accept-Ranges", "bytes");
                              headers.put("Content-Length", String.valueOf(len));
                              headers.put("Content-Range", "bytes " + start + "-" + end + "/" + total);
                              headers.put("Access-Control-Allow-Origin", "*");
                              return new WebResourceResponse(mimeType, null, 206, "Partial Content", headers, new ByteArrayInputStream(data, start, len));
                          }
                          Map<String, String> headers = new HashMap<>();
                          headers.put("Access-Control-Allow-Origin", "*");
                          headers.put("Accept-Ranges", "bytes");
                          return new WebResourceResponse(mimeType, null, 200, "OK", headers, getAssets().open(assetPath));
                      } catch (IOException e) {
                          return null;
                      }
                  }

                  private String getRangeHeader(Map<String, String> headers) {
                      if (headers == null) return null;
                      for (Map.Entry<String, String> entry : headers.entrySet()) {
                          if ("range".equalsIgnoreCase(entry.getKey())) return entry.getValue();
                      }
                      return null;
                  }

                  private byte[] readAllBytes(InputStream is) throws IOException {
                      try (InputStream input = is; ByteArrayOutputStream buffer = new ByteArrayOutputStream()) {
                          byte[] chunk = new byte[16384];
                          int read;
                          while ((read = input.read(chunk)) != -1) buffer.write(chunk, 0, read);
                          return buffer.toByteArray();
                      }
                  }

                  private String getMimeType(String path) {
                      String lower = path.toLowerCase(Locale.ROOT);
                      if (lower.endsWith(".html")) return "text/html";
                      if (lower.endsWith(".js") || lower.endsWith(".mjs")) return "application/javascript";
                      if (lower.endsWith(".css")) return "text/css";
                      if (lower.endsWith(".png")) return "image/png";
                      if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
                      if (lower.endsWith(".svg")) return "image/svg+xml";
                      if (lower.endsWith(".wav")) return "audio/wav";
                      if (lower.endsWith(".mp3")) return "audio/mpeg";
                      if (lower.endsWith(".json")) return "application/json";
                      if (lower.endsWith(".woff2")) return "font/woff2";
                      if (lower.endsWith(".woff")) return "font/woff";
                      return "application/octet-stream";
                  }
              }
          }
          EOF

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK missing at $APK_PATH"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TMP_DIR}/app-debug.apk"
          echo "apk_path=${TMP_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          APK_ASSET="${{ steps.prepare_asset.outputs.apk_path }}"
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES="Automatically generated debug APK for testing."
          gh release create "$TAG" "${APK_ASSET}#app-debug.apk" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"
